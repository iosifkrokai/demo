# The gates the README calls "CI equivalent" — backend (ruff + pyright + the
# offline seed contract + pytest) and frontend (typecheck + eslint + vitest),
# the same commands as `make test-backend` / `make test-frontend`. All pass on a
# clean checkout; a red job means the tree is not green.
name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (locked)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Type-check (pyright)
        run: .venv/bin/pyright

      - name: Seed data contract (offline)
        # "Data is code": the committed CSVs must still validate. No DB, no network.
        run: .venv/bin/python -m seed --dry-run

      - name: Tests (pytest)
        run: .venv/bin/python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Type-check (tsc)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Tests (vitest)
        run: npm test -- run

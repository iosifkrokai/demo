services:
  db:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    container_name: grodno-db
    environment:
      POSTGRES_USER: grodno
      POSTGRES_PASSWORD: grodno
      POSTGRES_DB: grodno
    ports: ["5432:5432"]
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grodno -d grodno"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Without this the database was the one service that could stay dead: the
    # Docker daemon here kills containers with exit 255 from time to time, and
    # the other three came back while Postgres did not — taking the agent, which
    # waits for 5432, into a restart loop with it.
    restart: unless-stopped

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: grodno-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      tile_urls: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
    volumes:
      - ./valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      # Baked into the bundle by Vite; all values come from the single root .env.
      args:
        VITE_AGENT_URL: "${VITE_AGENT_URL:-}"
        VITE_VALHALLA_URL: "${VITE_VALHALLA_URL:-}"
        VITE_NOMINATIM_URL: "${VITE_NOMINATIM_URL:-}"
        VITE_TILE_SERVER_URL: "${VITE_TILE_SERVER_URL:-}"
        VITE_CENTER_COORDS: "${VITE_CENTER_COORDS:-}"
        VITE_DEFAULT_COSTING_MODEL: "${VITE_DEFAULT_COSTING_MODEL:-}"
        VITE_CLIENT_ID: "${VITE_CLIENT_ID:-}"
    container_name: grodno-frontend
    environment:
      SKIP_PREFLIGHT_CHECK: "true"
      # Rendered into nginx.conf at container start (nginx templates + envsubst).
      # 172.17.0.1 = the Docker host: the agent runs there via uvicorn, and on
      # some hosts container→container traffic on the compose bridge is blocked,
      # so Valhalla is reached through its published port too.
      # host.docker.internal = the Docker host on Linux, macOS and Windows
      # (the extra_hosts mapping below provides it on Linux). On a host where
      # container→container traffic is allowed, override with agent:8080 / valhalla:8002.
      AGENT_UPSTREAM: "${AGENT_UPSTREAM:-host.docker.internal:8080}"
      VALHALLA_UPSTREAM: "${VALHALLA_UPSTREAM:-host.docker.internal:8002}"
    ports:
      - "80:80"
    depends_on:
      - valhalla
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grodno-agent
    # Host networking on purpose. In this sandbox containers cannot reach each
    # other over the compose network: measured from inside grodno-agent, DNS
    # resolved `db` to 172.18.0.4 and `valhalla` to 172.18.0.2, yet psycopg
    # timed out after 8.4s and http://valhalla:8002 never answered — the agent
    # hung in startup («Waiting for application startup»), never bound :8080 and
    # the panel showed 502 for a reason that had nothing to do with the app. On
    # the host's network the agent reaches the same localhost:5432 and
    # localhost:8002 the host process uses (they are published ports), while the
    # frontend still finds it on host.docker.internal:8080 (AGENT_UPSTREAM).
    network_mode: host
    # The single project env file — the same one the frontend and local runs use.
    env_file:
      - .env
    environment:
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8080"
    # Run the venv's python, not `uv run`: the image already synced its
    # dependencies at build time, and `uv run` re-resolves them at every start —
    # which needs PyPI and leaves the container in a restart loop the moment the
    # network or DNS is down (`failed to lookup address information`). The agent
    # then answers nothing and the panel shows 502 for a reason that has nothing
    # to do with the app.
    command: ["/app/.venv/bin/python", "-m", "agent.main"]
    depends_on:
      - db
      - valhalla
    restart: unless-stopped

volumes:
  pgdata:

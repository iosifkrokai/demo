services:
  pbf-sidecar:
    image: python:3.12-alpine
    container_name: grodno-pbf-sidecar
    working_dir: /data
    command: ["python", "-m", "http.server", "8001"]
    volumes:
      - ./valhalla-data:/data:ro
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: grodno-db
    environment:
      POSTGRES_USER: grodno
      POSTGRES_PASSWORD: grodno
      POSTGRES_DB: grodno
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grodno -d grodno"]
      interval: 5s
      timeout: 5s
      retries: 20

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: grodno-valhalla
    depends_on:
      - pbf-sidecar
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      tile_urls: http://pbf-sidecar:8001/grodno.osm.pbf
    volumes:
      - valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  valhalla-app:
    build: ./web-app
    container_name: grodno-valhalla-app
    ports: ["80:80"]
    depends_on:
      - valhalla
    volumes:
      - ./web-app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  valhalla-data:

# The whole product in one `docker compose up -d`: db + valhalla + agent + frontend.
#
# The agent runs on the compose network (it reaches `db:5432` and `valhalla:8002`
# by service name); the frontend's nginx proxies to `agent:8080`. On a host whose
# Docker bridge filters container→container traffic, override with
# docker-compose.host.yml (see README §9).
#
# Seeding is a profile-gated one-shot so `up -d` never seeds by itself:
#   docker compose --profile seed run --rm seed          # full restore / refresh
#   docker compose --profile seed run --rm seed fetch     # re-acquire OSM first

services:
  db:
    build:
      context: ./backend
      dockerfile_inline: |
        FROM pgvector/pgvector:pg16
        RUN apt-get update && apt-get install -y --no-install-recommends \
              ca-certificates curl gnupg lsb-release \
            && install -d /etc/apt/keyrings \
            && curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
                 | gpg --dearmor -o /etc/apt/keyrings/postgresql.gpg \
            && . /etc/os-release \
            && echo "deb [signed-by=/etc/apt/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $${VERSION_CODENAME}-pgdg main" \
                 > /etc/apt/sources.list.d/pgdg.list \
            && apt-get update \
            && apt-get install -y --no-install-recommends postgresql-16-postgis-3 \
            && rm -rf /var/lib/apt/lists/*
    container_name: grodno-db
    environment:
      POSTGRES_USER: grodno
      POSTGRES_PASSWORD: grodno
      POSTGRES_DB: grodno
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grodno -d grodno"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: grodno-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      tile_urls: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
    volumes:
      - ./valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grodno-agent
    # environment: wins over env_file, so the DSN/URL point at the compose
    # services even though .env carries the localhost values for host runs.
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-grodno}:${POSTGRES_PASSWORD:-grodno}@db:5432/${POSTGRES_DB:-grodno}"
      VALHALLA_URL: "http://valhalla:8002"
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8080"
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      # Baked into the bundle by Vite; all values come from the single root .env.
      args:
        VITE_AGENT_URL: "${VITE_AGENT_URL:-}"
        VITE_VALHALLA_URL: "${VITE_VALHALLA_URL:-}"
        VITE_NOMINATIM_URL: "${VITE_NOMINATIM_URL:-}"
        VITE_TILE_SERVER_URL: "${VITE_TILE_SERVER_URL:-}"
        VITE_CENTER_COORDS: "${VITE_CENTER_COORDS:-}"
        VITE_DEFAULT_COSTING_MODEL: "${VITE_DEFAULT_COSTING_MODEL:-}"
        VITE_CLIENT_ID: "${VITE_CLIENT_ID:-}"
    container_name: grodno-frontend
    environment:
      SKIP_PREFLIGHT_CHECK: "true"
      # Rendered into nginx.conf at container start (nginx templates + envsubst).
      AGENT_UPSTREAM: "${AGENT_UPSTREAM:-agent:8080}"
      VALHALLA_UPSTREAM: "${VALHALLA_UPSTREAM:-valhalla:8002}"
    ports:
      - "80:80"
    depends_on:
      agent:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped

  # One-shot seeding. Not started by `up -d`; run explicitly:
  #   docker compose --profile seed run --rm seed [fetch|photos|prune]
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: ["seed"]
    container_name: grodno-seed
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-grodno}:${POSTGRES_PASSWORD:-grodno}@db:5432/${POSTGRES_DB:-grodno}"
    env_file:
      - .env
    volumes:
      # `fetch` and `photos` write the versioned CSVs back to the checkout.
      - ./backend/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: ["/app/.venv/bin/python", "-m", "seed"]

volumes:
  pgdata:

services:
  db:
    build:
      context: ./backend
      dockerfile: db/Dockerfile
    container_name: grodno-db
    environment:
      POSTGRES_USER: grodno
      POSTGRES_PASSWORD: grodno
      POSTGRES_DB: grodno
    ports: ["5432:5432"]
    volumes:
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grodno -d grodno"]
      interval: 5s
      timeout: 5s
      retries: 20

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: grodno-valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      tile_urls: "https://download.geofabrik.de/europe/belarus-latest.osm.pbf"
    volumes:
      - ./valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: grodno-frontend
    environment:
      VITE_AGENT_URL: "http://localhost:8080"
      VITE_VALHALLA_URL: "http://localhost:8002"
      SKIP_PREFLIGHT_CHECK: "true"
    ports:
      - "80:80"
    depends_on:
      - valhalla
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  agent:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grodno-agent
    environment:
      AGENT_HOST: "0.0.0.0"
      AGENT_PORT: "8080"
      DATABASE_URL: "postgresql://grodno:grodno@db:5432/grodno"
      VALHALLA_URL: "http://valhalla:8002"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      RERANK_ENABLED: "${RERANK_ENABLED:-1}"
    ports:
      - "8080:8080"
    depends_on:
      - db
      - valhalla
    restart: unless-stopped

volumes:
  pgdata:

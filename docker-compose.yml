services:
  pbf-sidecar:
    # Tiny static file server that exposes valhalla-data/ to the valhalla container
    # via the compose network. Lets us feed an osmium-cut PBF into gisops without
    # making it re-download the full Belarus extract from Geofabrik.
    image: python:3.12-alpine
    container_name: grodno-pbf-sidecar
    working_dir: /data
    command: ["python", "-m", "http.server", "8001"]
    volumes:
      - ./valhalla-data:/data:ro
    restart: unless-stopped
    # no ports published — only reachable inside the compose network

  db:
    # pgvector/pgvector:pg16 ships with pgvector only, no PostGIS. We build a
    # tiny layer on top that adds postgresql-16-postgis-3 from the PGDG repo.
    # See db/Dockerfile.
    build:
      context: .
      dockerfile: db/Dockerfile
    container_name: grodno-db
    environment:
      POSTGRES_USER: grodno
      POSTGRES_PASSWORD: grodno
      POSTGRES_DB: grodno
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grodno -d grodno"]
      interval: 5s
      timeout: 5s
      retries: 20

  valhalla:
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: grodno-valhalla
    depends_on:
      - pbf-sidecar
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      tile_urls: http://pbf-sidecar:8001/grodno.osm.pbf
    volumes:
      - valhalla-data:/custom_files
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8002/status"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 30s

  valhalla-app:
    build: ./web-app
    container_name: grodno-valhalla-app
    ports: ["80:80"]
    depends_on:
      - valhalla
    # Loki (Valhalla's HTTP server) doesn't handle OPTIONS preflight. We override
    # the webapp's nginx to proxy /route /status /etc. to the engine container,
    # so the browser sees same-origin requests and skips CORS preflight entirely.
    volumes:
      - ./web-app-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  pgdata:
  valhalla-data:

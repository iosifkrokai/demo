# nginx config for the valhalla/web-app container.
# Mounted over /etc/nginx/conf.d/default.conf so we can intercept Valhalla API calls
# and proxy them to the engine container. From the browser's POV the SPA and the
# API share origin (both on http://localhost:80), so the browser skips the CORS
# preflight that Loki (Valhalla's HTTP server) doesn't handle.
#
# Valhalla endpoints (per valhalla-client.py and web-app/src/utils/valhalla.ts):
#   /route /isochrone /optimized_route /status /locate /height /tile
#
# Anything else falls through to the SPA's index.html (TanStack Router does the rest).

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Valhalla API: proxy to the engine container, preserving the query string.
    # Regex anchored with $ so we don't accidentally swallow SPA paths like /routes/123.
    location ~ ^/(route|isochrone|optimized_route|status|tile|locate|height)$ {
        proxy_pass         http://valhalla:8002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA static files
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

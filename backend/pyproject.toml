[project]
name = "grodno-agent"
version = "0.2.0"
description = "Free-text → pedestrian walking route planner for Grodno"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-ai-slim[openrouter]>=1.0,<2",
    "fastembed>=0.9.0",
    "numpy>=1.26",
    "langfuse>=3.0",
    "alembic>=1.13",
]

[project.urls]
Repository = "https://github.com/kioharu/grodno-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "contracts", "core", "db", "domain", "ml", "planner", "reference", "telemetry"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.uv]
constraint-dependencies = ["genai-prices<0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "PIE",
    "RUF",
    "N",
    "ARG",
    "PL",
]
ignore = [
    "E501",
    "B008",
    "PLR0913",
    "PLR2004",
    "N806",
    "ARG002",
    "ARG004",
    "RUF001", "RUF002", "RUF003",
    "PLC0415",
    "PLR0911", "PLR0912", "PLR0915", "PLR0917",
    "N818",
    "ARG001",
    "B905", "RUF007",
    "RUF005", "RUF015", "RUF046", "PLW2901",
    "SIM102", "SIM105", "SIM108", "SIM117", "PLR1714", "PLC0206",
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "PLR2004", "ARG", "RUF012"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "contracts", "core", "db", "domain", "ml", "planner", "reference", "telemetry"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["agent", "api", "contracts", "core", "db", "domain", "ml", "planner", "reference", "telemetry"]
exclude = [".venv"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportOptionalMemberAccess = "warning"
reportOptionalIterable = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportOptionalIterator = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportPrivateImportUsage = "warning"
reportSelfClsParameterName = "warning"
reportImplicitStringConcatenation = "warning"
reportUndefinedVariable = "error"

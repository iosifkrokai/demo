[project]
name = "grodno-agent"
version = "0.2.0"
description = "Free-text → pedestrian walking route planner for Grodno"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-ai-slim[openrouter]>=1.0,<2",
    "fastembed>=0.9.0",
    "numpy>=1.26",
    "langfuse>=3.0",
    "alembic>=1.13",
]

[project.urls]
Repository = "https://github.com/kioharu/grodno-agent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "core", "db", "embeddings", "planner", "reference", "telemetry"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.uv]
constraint-dependencies = ["genai-prices<0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "PIE",
    "RUF",
    "N",
    "ARG",
    "PL",
]
ignore = [
    # The product speaks Russian: Cyrillic in a string is the point, not a defect.
    "RUF001", "RUF002", "RUF003",
    # FastAPI requires a call in the default (Depends(...)): the framework's idiom.
    "B008",

    # --- deferred, counted on 2026-10-11 --------------------------------------
    # These are not "rules we would rather not have"; each is a campaign of its
    # own, and the count is here so the debt is visible in one place instead of
    # implied by an absent rule. Removing an entry means doing that campaign.
    "PLC0415", # 92  imports inside functions — most exist to break a real cycle
    "PLR2004", # 87  magic values — mostly "a route needs at least two stops"
    "PLR0913", # 42  too many arguments
    "PLR0917", # 14  too many positional arguments
    "ARG001",  # 11  unused function argument: parameters a refactor left behind
    "N818",    # 9   exception names without an `Error` suffix
    "PLR0912", # 8   too many branches
    "PLR0915", # 8   too many statements
    "PLR0911", # 4   too many return statements
    "ARG002",  # 3   unused method argument
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "PLR2004", "ARG", "RUF012"]
"**/__init__.py" = ["F401"]
# The baseline reproduces the old init.sql statement for statement —
# its own docstring claims that — so wrapping its lines for style
# would break the claim it exists to make.
"db/alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "core", "db", "embeddings", "planner", "reference", "telemetry"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["agent", "api", "core", "db", "embeddings", "planner", "reference", "telemetry"]
exclude = [".venv"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportOptionalMemberAccess = "warning"
reportOptionalIterable = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportOptionalIterator = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportPrivateImportUsage = "warning"
reportSelfClsParameterName = "warning"
reportImplicitStringConcatenation = "warning"
reportUndefinedVariable = "error"

# ─────────────────────────────────────────────────────────────────────────────
# pyproject.toml — single source of truth for the agent project.
# Replaces requirements.txt + a separate dev-requirements file.
# Use `uv sync` to install everything; `uv sync --no-dev` for prod-only.
# ─────────────────────────────────────────────────────────────────────────────

[project]
name = "grodno-agent"
version = "0.2.0"
description = "Free-text → pedestrian walking route planner for Grodno"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# ── Runtime dependencies ──
# Listed in dependency order: web framework, db, http, ML, types.
dependencies = [
    # Web framework
    "fastapi>=0.110",
    "uvicorn>=0.27",                # base — extras are dev-only
    # Database
    "psycopg[binary]>=3.2",         # [binary] ships libpq for the Docker image
    # HTTP client
    "httpx>=0.27",
    # Validation
    "pydantic>=2.7",
    # Agent framework — bounded tool-using interpretation layer (spec 002 §4.2).
    # slim + the openrouter extra (the provider is built on the openai SDK);
    # nothing else is pulled in. Without it the agent path degrades to the
    # deterministic reading instead of failing, so the pin can be conservative.
    "pydantic-ai-slim[openrouter]>=1.0,<2",
    # ML — embeddings + cross-encoder rerank
    "numpy>=1.26",                  # MMR diversity step
    # Observability — traces into a self-hosted Langfuse (see docker-compose.yml
    # `observability` profile). Optional: when no key is configured the exporter
    # is a no-op and the agent still answers.
    "langfuse>=3.0",
]

[project.optional-dependencies]
# Scripts in scripts/ — separate from runtime because the agent container
# doesn't need bs4/requests, but the one-shot ingest pipeline does.
scripts = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.urls]
Repository = "https://github.com/kioharu/grodno-agent"

# ─────────────────────────────────────────────────────────────────────────────
# Build system
# ─────────────────────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

# ─────────────────────────────────────────────────────────────────────────────
# Dev dependencies — `uv sync` installs these by default.
# `uv sync --no-dev` (or `uv sync --no-group dev`) skips them.
# ─────────────────────────────────────────────────────────────────────────────

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",                  # TestClient
    "ruff>=0.6",
    "pyright>=1.1",
    # The suite imports the one-shot scripts (e.g. tests/test_seed_geofence.py
    # imports scripts/parse_places.py), and those need the `scripts` extra. A
    # plain `uv sync` must be able to collect the whole suite, so the extra's
    # runtime deps belong here too.
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

# ─────────────────────────────────────────────────────────────────────────────
# uv — constraints on transitive dependencies
# ─────────────────────────────────────────────────────────────────────────────

[tool.uv]
# genai-prices 0.1.0 started reporting `output_reasoning_tokens`, a field
# pydantic-ai 1.107's RequestUsage does not accept. Its extract() builds the
# usage object as RequestUsage(**extracted), so the extra field raised on every
# provider candidate — and pydantic-ai swallows that per candidate and returns
# an empty usage. Every model call then reported 0 tokens, which is worse than
# no number at all: the trace claims the call was free. 0.0.73 is the newest
# release that reports only what pydantic-ai understands. Revisit when the
# pydantic-ai pin moves to 2.x, where RequestUsage accepts the field.
constraint-dependencies = ["genai-prices<0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# ─────────────────────────────────────────────────────────────────────────────
# Ruff — linting + formatting
# ─────────────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    ".legacy_backup",
    "web-app",
    "scripts/_legacy",
    "build",
    "dist",
]

[tool.ruff.lint]
# Strict-but-pragmatic rule set. Warns on real bugs, ignores stylistic noise.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes — unused imports/vars, undefined names
    "I",      # isort — import ordering
    "B",      # bugbear — common pitfalls
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade — modern syntax
    "SIM",    # flake8-simplify
    "PIE",    # flake8-pie
    "RUF",    # ruff-specific lints
    "N",      # pep8-naming
    "ARG",    # unused arguments
    "PL",     # pylint — useful subset
]
ignore = [
    "E501",   # line length — handled by formatter
    "B008",   # function call in default argument (FastAPI Depends pattern)
    "PLR0913",# too many arguments — pipeline.py needs them
    "PLR2004",# magic values — used in routing heuristics
    "N806",   # mixedCase variable in function — fine for math
    "ARG002", # unused method argument — common in protocols
    "ARG004", # unused static method argument
    # The product's own language is Russian: every Cyrillic «у»/«о»/«е»/«к»
    # that resembles a Latin letter trips the ambiguous-unicode rules. A Russian
    # string is *supposed* to contain Cyrillic, so these are noise, not findings
    # (they were 324 of 574 "errors" on a clean tree).
    "RUF001", "RUF002", "RUF003",
    # Local imports are deliberate: the interpretation SDK (pydantic_ai) is
    # imported only when a reading is actually attempted, and tests import the
    # symbol under test next to its use.
    "PLC0415",
    # ── Deliberate style, not defects ──────────────────────────────────────
    # Complexity thresholds: the planner's stages are dense by nature
    # (pipeline / optimize / bench_routes) and splitting them for a line count
    # would not make them easier to follow.
    "PLR0911", "PLR0912", "PLR0915", "PLR0917",
    # Domain exception names read better without an "Error" suffix
    # (StorageUnavailable, TooManyRoutes).
    "N818",
    # Unused arguments in protocols, fakes and fixed-signature callbacks.
    "ARG001",
    # zip(strict=) / pairwise preferences: the lengths are equal by construction
    # at these call sites, so the explicit flag is ceremony rather than a check.
    "B905", "RUF007",
    # Micro-style preferences this project does not enforce: list concatenation
    # vs unpacking, int() on an already-int value, next() vs [0], reusing a loop
    # variable name, merging/normalising small if/with/try blocks.
    "RUF005", "RUF015", "RUF046", "PLW2901",
    "SIM102", "SIM105", "SIM108", "SIM117", "PLR1714", "PLC0206",
    # A lambda assigned to a local name is the clearest form for the tiny
    # distance predicates in pipeline._geo_focus.
    "E731",
]

[tool.ruff.lint.per-file-ignores]
# Tests can have long lines, magic numbers, unused fixtures, mutable test
# doubles and dictionary walks written for readability.
"tests/**/*.py" = ["E501", "PLR2004", "ARG", "RUF012"]
"scripts/**/*.py" = ["E501"]
# __init__.py often has unused re-exports.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────────────
# Pyright — strict-ish type checking.
# ─────────────────────────────────────────────────────────────────────────────

[tool.pyright]
include = ["agent"]
exclude = [
    ".venv",
    ".legacy_backup",
    "web-app",
    "scripts",
]
pythonVersion = "3.12"
pythonPlatform = "Linux"

# Strict-but-not-paranoid. Catches real bugs without screaming about every
# psycopg Connection or Pydantic v2 quirk.
typeCheckingMode = "standard"
# Point pyright at the project's own interpreter: without this it cannot resolve
# psycopg / pydantic / fastapi and reports them as missing imports, which reads
# as 30+ errors that are not about the code at all.
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"   # Generic aliases in psycopg/fastapi

# Strict things we DO want flagged.
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportOptionalMemberAccess = "warning"
reportOptionalIterable = "warning"
reportOptionalSubscript = "warning"
reportOptionalCall = "warning"
reportOptionalOperand = "warning"
reportOptionalIterator = "warning"
reportTypedDictNotRequiredAccess = "warning"
reportPrivateImportUsage = "warning"
reportSelfClsParameterName = "warning"
reportImplicitStringConcatenation = "warning"
reportUndefinedVariable = "error"

# Per-file overrides: scripts and __init__.py are noisy.
[tool.pyright.executionEnvironments]
# Default: strict-ish

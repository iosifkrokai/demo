[project]
name = "grodno-agent"
version = "0.2.0"
description = "Free-text → pedestrian walking route planner for Grodno"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-ai-slim[openai,logfire]>=1.0,<2",
    "fastembed>=0.9.0",
    "alembic>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "core", "db", "routing"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.uv]
constraint-dependencies = ["genai-prices<0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "PIE",
    "RUF",
    "N",
    "ARG",
    "PL",
    "FURB",
    "ISC",
    "PT",
]
ignore = [
    "RUF001",
    "RUF002",
    "PLR0913",
    "PLR0912",
    "PLR0915",
    "PLR0911",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "ARG", "PLC0415"]
"db/seed/*.py" = ["PLC0415"]
"db/embeddings/model.py" = ["PLC0415"]
"db/alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.isort]
known-first-party = ["agent", "api", "core", "db", "routing"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["agent", "api", "core", "db", "routing"]
exclude = [".venv"]
pythonVersion = "3.12"
pythonPlatform = "Linux"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportUnknownMemberType = "none"
reportImplicitStringConcatenation = "warning"
reportUnusedFunction = "warning"

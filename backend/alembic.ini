# Alembic configuration for the Grodno Postgres schema.
#
# The DSN is NOT set here: alembic/env.py takes it from core.config
# (settings.DSN, i.e. the DATABASE_URL environment variable, with the
# localhost default). Run from backend/ so `core` is importable:
#
#   cd backend && .venv/bin/python -m alembic upgrade head
#
# or, from the repo root, `make migrate`.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# Set programmatically by env.py from core.config.settings.DSN.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

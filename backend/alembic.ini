# The DSN is taken from core.config by db/alembic/env.py, so Alembic must be run
# from backend/ for `core` to be importable (`make migrate`).

[alembic]
script_location = %(here)s/db/alembic
prepend_sys_path = .
path_separator = os
# Set programmatically by env.py from core.config.settings.DSN.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

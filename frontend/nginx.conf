server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # --- Compression ---------------------------------------------------------------
    # Every byte the browser downloads goes through here (see C8): brotli when the
    # client asks for it, gzip as the fallback that covers the rest — the JS/CSS,
    # the JSON of `/places` and `/routes/*` (proxied responses included) and the
    # Ferrostar WASM. `nginx:1.29-alpine` ships without ngx_brotli, so the module
    # is compiled for this image in the Dockerfile's `nginx-brotli` stage and
    # loaded from /etc/nginx/modules/brotli.conf; gzip stays on beside it so a
    # client that cannot do br still gets a compressed body.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    brotli on;
    brotli_comp_level 6;
    brotli_min_length 1024;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # Agent API proxy — the agent runs on the host (uvicorn :8080), not in
    # compose. AGENT_UPSTREAM comes from docker-compose.yml; 172.17.0.1 is the
    # host as seen from inside a container on Linux/Codespaces.
    location /routes/ {
        proxy_pass         http://${AGENT_UPSTREAM};
        proxy_http_version 1.1;
        # A route request is allowed 150 s inside the agent
        # (agent.runner.WALL_CLOCK_TIMEOUT_S), so nginx's own 60 s default cut
        # the slowest ones off with a 504 that the tourist would read as
        # «всё сломалось». Kept comfortably above the agent's ceiling: whoever
        # gives up first did not mean to be the limit.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 15s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
    }

    # The full point catalogue — one read, no model involved (see `/places` on
    # the agent). It is a top-level path, not under `/routes/`, so it needs its
    # own proxy rule; without it nginx answers with index.html and the tab shows
    # «точек нет» for a reason that has nothing to do with the dataset.
    location /places {
        proxy_pass         http://${AGENT_UPSTREAM};
        proxy_http_version 1.1;
        proxy_read_timeout  60s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
    }

    # Accounts, visits and the admin panel (spec 005). Three prefixes, one shape:
    # the session cookie is HttpOnly, so the browser attaches it itself — nginx
    # only has to pass the request (and the Set-Cookie back) unchanged.
    #
    # The trailing slash matters: `/admin/`, `/me/`, `/auth/` proxy, while the
    # *bare* `/admin`, `/login` and `/visited` stay SPA routes served by
    # `location /` below — otherwise the admin page would be proxied to the agent
    # and answer a 404 JSON, which is not the page the tourist asked for.
    location ~ ^/(auth|me|admin)/ {
        if ($request_method = OPTIONS) {
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass         http://${AGENT_UPSTREAM};
        proxy_http_version 1.1;
        proxy_read_timeout  60s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Pass the session cookie through in both directions, verbatim.
        proxy_set_header   Cookie $http_cookie;
        proxy_pass_header  Set-Cookie;
    }

    # Valhalla API. In this environment container→container traffic on the
    # compose bridge is blocked, so VALHALLA_UPSTREAM points at the published
    # host port; on a plain Docker host `valhalla:8002` works.
    location ~ ^/(route|isochrone|optimized_route|status|locate|height|tile)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass         http://${VALHALLA_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    root  /usr/share/nginx/html;
    index index.html;

    # --- Caching -------------------------------------------------------------------
    # Vite fingerprints every build artefact under `/assets`, so its content never
    # changes under a given name: cache it for a year and stop asking. A missing
    # hashed file answers 404 rather than the SPA shell — an HTML body served as JS
    # is a worse failure than a clean miss.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # The shell and the service worker are the two things that must NOT be cached:
    # a stale index.html pointing at a purged chunk is how a deploy breaks, and the
    # worker has to be re-read to notice its own update.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

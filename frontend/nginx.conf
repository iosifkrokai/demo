server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    # Agent API proxy — the agent runs on the host (uvicorn :8080), not in
    # compose. AGENT_UPSTREAM comes from docker-compose.yml; 172.17.0.1 is the
    # host as seen from inside a container on Linux/Codespaces.
    location /routes/ {
        proxy_pass         http://${AGENT_UPSTREAM};
        proxy_http_version 1.1;
        # A route request is allowed 75 s inside the agent (REQUEST_DEADLINE_S),
        # so nginx's own 60 s default cut the slowest ones off with a 504 that
        # the tourist would read as «всё сломалось». Kept comfortably above the
        # agent's ceiling: whoever gives up first did not mean to be the limit.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_connect_timeout 15s;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type' always;
    }

    # Anonymous client entity (spec 003): saved routes, preferences and
    # «удалить мои данные». Mutating verbs matter here — a preflight that is
    # not answered makes saving fail in the browser only.
    location /clients/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type, X-Client-Id' always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass         http://${AGENT_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Client-Id $http_x_client_id;
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Content-Type, X-Client-Id' always;
    }

    # Valhalla API. In this environment container→container traffic on the
    # compose bridge is blocked, so VALHALLA_UPSTREAM points at the published
    # host port; on a plain Docker host `valhalla:8002` works.
    location ~ ^/(route|isochrone|optimized_route|status|locate|height|tile)$ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Content-Type' always;
            add_header Content-Length 0;
            return 204;
        }
        proxy_pass         http://${VALHALLA_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
